spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fraud_engine}
spring.datasource.username=${DATABASE_USERNAME:fraud_engine}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.flyway.enabled=true
spring.data.web.pageable.max-page-size=100
fraud.security.username=${FRAUD_API_USERNAME}
fraud.security.password=${FRAUD_API_PASSWORD}
fraud.cors.allowed-origins=${FRAUD_CORS_ALLOWED_ORIGINS:}

# Provisional demo policy values. Replace them with values approved by the business.
fraud.policy-version=${FRAUD_POLICY_VERSION:demo-provisional-v1}
fraud.rules.amount.threshold=${FRAUD_RULES_AMOUNT_THRESHOLD:10000.00}
fraud.rules.amount.high-threshold=${FRAUD_RULES_AMOUNT_HIGH_THRESHOLD:20000.00}
fraud.rules.amount.critical-threshold=${FRAUD_RULES_AMOUNT_CRITICAL_THRESHOLD:50000.00}
fraud.rules.amount.score=${FRAUD_RULES_AMOUNT_SCORE:30}
fraud.rules.amount.high-score=${FRAUD_RULES_AMOUNT_HIGH_SCORE:50}
fraud.rules.amount.critical-score=${FRAUD_RULES_AMOUNT_CRITICAL_SCORE:80}
fraud.rules.country.missing-score=${FRAUD_RULES_COUNTRY_MISSING_SCORE:30}
